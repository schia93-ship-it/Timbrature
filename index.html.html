<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timbrature iPhone</title><style>body{font-family:-apple-system,Arial;background:#f2f2f7;margin:0;padding:10px}h1{text-align:center}table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #ddd;padding:4px;font-size:12px}input,select{width:100%;box-sizing:border-box}button{padding:10px;border:none;background:#007aff;color:#fff;border-radius:8px}#tot{background:#fff;padding:10px;margin-top:10px;border-radius:8px}</style></head><body><h1>Timbrature 36h</h1><div><label>Settimana:</label><input type="week" id="week"><button onclick="saveWeek()">Salva settimana</button></div><table><thead><tr><th>Giorno</th><th>Entrata</th><th>Tipo</th><th>Uscita prevista</th><th>Uscita reale</th><th>Saldo</th></tr></thead><tbody><tr><td>Lun</td><td><input type="time" class="in"></td><td><select class="tipo"><option value="uff">Ufficio</option><option value="sw">Smart</option><option value="ferie">Ferie</option><option value="perm">Permesso</option><option value="mal">Malattia</option></select></td><td class="prev"></td><td><input type="time" class="out"></td><td class="saldo"></td></tr><tr><td>Mar</td><td><input type="time" class="in"></td><td><select class="tipo"><option value="uff">Ufficio</option><option value="sw">Smart</option><option value="ferie">Ferie</option><option value="perm">Permesso</option><option value="mal">Malattia</option></select></td><td class="prev"></td><td><input type="time" class="out"></td><td class="saldo"></td></tr><tr><td>Mer</td><td><input type="time" class="in"></td><td><select class="tipo"><option value="uff">Ufficio</option><option value="sw">Smart</option><option value="ferie">Ferie</option><option value="perm">Permesso</option><option value="mal">Malattia</option></select></td><td class="prev"></td><td><input type="time" class="out"></td><td class="saldo"></td></tr><tr><td>Gio</td><td><input type="time" class="in"></td><td><select class="tipo"><option value="uff">Ufficio</option><option value="sw">Smart</option><option value="ferie">Ferie</option><option value="perm">Permesso</option><option value="mal">Malattia</option></select></td><td class="prev"></td><td><input type="time" class="out"></td><td class="saldo"></td></tr><tr><td>Ven</td><td><input type="time" class="in"></td><td><select class="tipo"><option value="uff">Ufficio</option><option value="sw">Smart</option><option value="ferie">Ferie</option><option value="perm">Permesso</option><option value="mal">Malattia</option></select></td><td class="prev"></td><td><input type="time" class="out"></td><td class="saldo"></td></tr></tbody></table><div id="tot"></div><script>const STD=432,PAUSA=30;function m(t){if(!t)return 0;let a=t.split(':');return +a[0]*60+ +a[1]}function f(v){return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')}function calc(){let banca=0,tot=0;document.querySelectorAll('tbody tr').forEach(r=>{let tipo=r.querySelector('.tipo').value;let en=r.querySelector('.in');let out=r.querySelector('.out');let prev=r.querySelector('.prev');let saldo=r.querySelector('.saldo');if(tipo!=='uff'){en.disabled=true;out.disabled=true;prev.textContent=tipo.toUpperCase();saldo.textContent='0';tot+=STD;return}else{en.disabled=false;out.disabled=false}if(en.value){prev.textContent=f(m(en.value)+STD+PAUSA-banca)}if(en.value&&out.value){let lav=m(out.value)-m(en.value)-PAUSA;let diff=lav-STD;banca+=diff;tot+=lav;saldo.textContent=(diff>0?'+':'')+diff+' min'}});document.getElementById('tot').innerHTML='Totale: '+(tot/60).toFixed(2)+' ore | Saldo settimana: '+banca+' min';autoSave()}function saveWeek(){let data=[];document.querySelectorAll('tbody tr').forEach(r=>data.push({i:r.querySelector('.in').value,o:r.querySelector('.out').value,t:r.querySelector('.tipo').value}));localStorage.setItem('TIMB_'+document.getElementById('week').value,JSON.stringify(data));alert('Settimana salvata')}function autoSave(){if(document.getElementById('week').value)saveSilent()}function saveSilent(){let data=[];document.querySelectorAll('tbody tr').forEach(r=>data.push({i:r.querySelector('.in').value,o:r.querySelector('.out').value,t:r.querySelector('.tipo').value}));localStorage.setItem('TIMB_'+document.getElementById('week').value,JSON.stringify(data))}function loadWeek(){let d=localStorage.getItem('TIMB_'+document.getElementById('week').value);if(!d)return;d=JSON.parse(d);document.querySelectorAll('tbody tr').forEach((r,n)=>{if(d[n]){r.querySelector('.in').value=d[n].i;r.querySelector('.out').value=d[n].o;r.querySelector('.tipo').value=d[n].t;}});calc()}document.addEventListener('input',calc);document.getElementById('week').addEventListener('change',loadWeek);</script></body></html>
